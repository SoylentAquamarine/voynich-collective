# Deletes the temporary encrypted transfer branch after the analysing session has picked it up.
name: Yale transfer branch cleanup
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - run: git init -q . && git push "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}" --delete yale-transfer-tmp || echo "branch already gone"
