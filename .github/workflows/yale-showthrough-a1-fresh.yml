# Runs the preregistered fresh random-folio test of show-through design A1 on a GitHub-hosted
# runner (the project's cloud sandboxes cannot reach Yale's IIIF hosts).
# Preregistration: logs/2026-11-05-showthrough-a1-fresh-heldout-selfreview.md
# Authorization: config/user-authorizations.md (2026-11-01 02:47 UTC; analysis only).
# Images stay in $RUNNER_TEMP and are discarded with the runner; main gets ONLY the results CSV.
name: Yale show-through A1 fresh random-folio test
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet numpy scipy pillow
      - name: Run registration
        id: reg
        continue-on-error: true
        run: python3 data/scripts/showthrough_a1_fresh.py --image-dir "$RUNNER_TEMP/yale-showthrough-fresh"
      - name: Commit results CSV (no images)
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          [ -f research/2026-11-05-showthrough-a1-fresh-heldout.csv ] || { echo "no results file"; exit 1; }
          git add research/2026-11-05-showthrough-a1-fresh-heldout.csv
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "show-through A1 fresh random-folio results (Actions run ${GITHUB_RUN_ID}, script: ${{ steps.reg.outcome }})" -m "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. No image bytes committed." -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"
          git pull --rebase -q origin main && git push origin HEAD:main
      - name: Fail if script failed
        if: steps.reg.outcome != 'success'
        run: exit 1
