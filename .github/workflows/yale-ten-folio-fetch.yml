# Runs the ten-folio Yale native retrieval kit on a GitHub-hosted runner,
# because the project's cloud sandboxes cannot reach Yale's IIIF hosts.
# Authorization: config/user-authorizations.md (2026-11-01 02:47 UTC; analysis only).
# Commits ONLY the receipt CSV and blank cell template (no image bytes).
# Images leave the runner only as an AES-256 encrypted, 1-day artifact for
# the analysing session; they are never published in readable form.
name: Yale ten-folio native fetch
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Run retrieval kit
        id: kit
        continue-on-error: true
        run: python3 data/scripts/yale_ten_folio_native_fetch.py --image-dir "$RUNNER_TEMP/yale-native"
      - name: Commit receipt (no images)
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add research/2026-11-01-ten-folio-native-receipt.csv research/2026-11-01-ten-folio-cell-template.csv 2>/dev/null || true
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "Ten-folio Yale native retrieval receipt (GitHub Actions run ${GITHUB_RUN_ID}, kit outcome: ${{ steps.kit.outcome }})" -m "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. No image bytes committed." -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"
          git pull --rebase -q origin main && git push origin HEAD:main
      - name: Encrypt images for the analysing session
        env:
          KEY: ${{ secrets.YALE_ARTIFACT_KEY }}
        run: |
          cd "$RUNNER_TEMP" && ls -la yale-native && sha256sum yale-native/*
          tar cf - yale-native | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:KEY -out yale-native.tar.enc
      - uses: actions/upload-artifact@v4
        with:
          name: yale-native-encrypted
          path: ${{ runner.temp }}/yale-native.tar.enc
          retention-days: 1
      - name: Fail if kit failed
        if: steps.kit.outcome != 'success'
        run: exit 1
