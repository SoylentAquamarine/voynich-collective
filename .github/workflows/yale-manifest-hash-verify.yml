# Runs the preregistered PR #91 manifest 1200-px hash re-verification (all 213 rows) on a GitHub-hosted runner
# (the project's cloud sandboxes cannot reach Yale's IIIF hosts).
# Preregistration: logs/2026-11-05-yale-manifest-full-hash-verification-selfreview.md
# Authorization: config/user-authorizations.md (2026-11-01 02:47 UTC; analysis only).
# Images are hashed in memory only; main gets ONLY the results CSV.
name: Yale manifest hash verification
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Run verification
        id: reg
        continue-on-error: true
        run: python3 data/scripts/yale_manifest_hash_verify.py
      - name: Commit results CSV (no images)
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          [ -f research/2026-11-05-yale-manifest-hash-verification.csv ] || { echo "no results file"; exit 1; }
          git add research/2026-11-05-yale-manifest-hash-verification.csv
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "Yale manifest hash verification results (Actions run ${GITHUB_RUN_ID}, script: ${{ steps.reg.outcome }})" -m "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. No image bytes committed." -m "Co-Authored-By: Claude Sonnet 5 <noreply@anthropic.com>"
          git pull --rebase -q origin main && git push origin HEAD:main
      - name: Fail if script failed
        if: steps.reg.outcome != 'success'
        run: exit 1
