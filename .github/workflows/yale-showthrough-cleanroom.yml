# Runs the clean-room (implementation-level) reproduction of all three 2026-11-05 show-through
# result sets on a GitHub-hosted runner (the project's cloud sandboxes cannot reach Yale's IIIF hosts).
# Preregistration: logs/2026-11-05-showthrough-cleanroom-reproduction-selfreview.md
# Authorization: config/user-authorizations.md (2026-11-01 02:47 UTC; analysis only).
# Images stay in $RUNNER_TEMP and are discarded with the runner; images are never committed.
# main gets ONLY research/2026-11-05-showthrough-cleanroom-reproduction.csv.
name: Yale show-through clean-room reproduction
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet numpy scipy pillow
      - name: Run clean-room reproduction
        id: repro
        continue-on-error: true
        run: python3 data/scripts/showthrough_cleanroom.py --image-dir "$RUNNER_TEMP/yale-cleanroom"
      - name: Commit results CSV (no images)
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          [ -f research/2026-11-05-showthrough-cleanroom-reproduction.csv ] || { echo "no results file"; exit 1; }
          git add research/2026-11-05-showthrough-cleanroom-reproduction.csv
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "show-through clean-room reproduction results (Actions run ${GITHUB_RUN_ID}, script: ${{ steps.repro.outcome }})" -m "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. No image bytes committed." -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"
          git pull --rebase -q origin main && git push origin HEAD:main
      - name: Fail if script failed
        if: steps.repro.outcome != 'success'
        run: exit 1
