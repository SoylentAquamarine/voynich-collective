<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-labelledby="title desc">
  <title id="title">Document-stratified local constraint across five language corpora</title>
  <desc id="desc">For Turkish, Estonian, Arabic, Hebrew, and English, 95 percent empirical intervals from 200 document-stratified surface-token samples lie below both the conservative atomic-EVA Voynich reference and the literal-EVA reference. Shuffled controls are near zero.</desc>
  <style>
    .title { font: 700 20px Georgia, serif; fill: #2d2922; }
    .subtitle, .tick, .legend, .value { font: 12px Arial, sans-serif; fill: #665f53; }
    .label { font: 700 14px Arial, sans-serif; fill: #2d2922; }
    .grid { stroke: #d4cbbb; stroke-width: 1; }
    .primary { stroke: #9b5948; stroke-width: 10; stroke-linecap: round; }
    .primary-dot { fill: #672f29; }
    .shuffle { stroke: #7d9b78; stroke-width: 7; stroke-linecap: round; }
    .shuffle-dot { fill: #365d43; }
    .atomic { stroke: #5e2f2f; stroke-width: 3; stroke-dasharray: 7 5; }
    .literal { stroke: #8d6b27; stroke-width: 2; stroke-dasharray: 3 5; }
  </style>
  <rect width="100%" height="100%" fill="#f6f0e3"/>
  <text x="205" y="30" class="title">Voynich remains outside the broader document-stratified panel</text>
  <text x="205" y="53" class="subtitle">Surface-token constraint; median dot and 2.5–97.5% interval; green = within-token shuffle</text>
  <line x1="205.0" y1="105" x2="205.0" y2="445" class="grid"/><text x="205.0" y="470" text-anchor="middle" class="tick">0.0</text><line x1="347.0" y1="105" x2="347.0" y2="445" class="grid"/><text x="347.0" y="470" text-anchor="middle" class="tick">0.1</text><line x1="489.0" y1="105" x2="489.0" y2="445" class="grid"/><text x="489.0" y="470" text-anchor="middle" class="tick">0.2</text><line x1="631.0" y1="105" x2="631.0" y2="445" class="grid"/><text x="631.0" y="470" text-anchor="middle" class="tick">0.3</text><line x1="773.0" y1="105" x2="773.0" y2="445" class="grid"/><text x="773.0" y="470" text-anchor="middle" class="tick">0.4</text><line x1="915.0" y1="105" x2="915.0" y2="445" class="grid"/><text x="915.0" y="470" text-anchor="middle" class="tick">0.5</text>
  <line x1="808.1" y1="105" x2="808.1" y2="445" class="atomic"/>
  <line x1="849.5" y1="105" x2="849.5" y2="445" class="literal"/>
  <text x="801.1" y="88" text-anchor="end" class="legend">atomic EVA 0.4247</text>
  <text x="856.5" y="102" class="legend">literal EVA 0.4539</text>
  <text x="190" y="150" text-anchor="end" class="label">Turkish</text><line x1="535.0" y1="137" x2="540.0" y2="137" class="primary"/><circle cx="537.3" cy="137" r="6" class="primary-dot"/><line x1="254.9" y1="157" x2="257.3" y2="157" class="shuffle"/><circle cx="256.0" cy="157" r="5" class="shuffle-dot"/><text x="548.0" y="141" class="value">0.234</text><text x="190" y="215" text-anchor="end" class="label">Estonian</text><line x1="461.8" y1="202" x2="478.5" y2="202" class="primary"/><circle cx="469.6" cy="202" r="6" class="primary-dot"/><line x1="223.9" y1="222" x2="227.5" y2="222" class="shuffle"/><circle cx="225.7" cy="222" r="5" class="shuffle-dot"/><text x="486.5" y="206" class="value">0.186</text><text x="190" y="280" text-anchor="end" class="label">Arabic</text><line x1="366.8" y1="267" x2="377.9" y2="267" class="primary"/><circle cx="373.1" cy="267" r="6" class="primary-dot"/><line x1="250.3" y1="287" x2="254.1" y2="287" class="shuffle"/><circle cx="252.1" cy="287" r="5" class="shuffle-dot"/><text x="385.9" y="271" class="value">0.118</text><text x="190" y="345" text-anchor="end" class="label">Hebrew</text><line x1="330.1" y1="332" x2="342.4" y2="332" class="primary"/><circle cx="336.5" cy="332" r="6" class="primary-dot"/><line x1="247.4" y1="352" x2="257.6" y2="352" class="shuffle"/><circle cx="252.5" cy="352" r="5" class="shuffle-dot"/><text x="350.4" y="336" class="value">0.093</text><text x="190" y="410" text-anchor="end" class="label">English</text><line x1="493.0" y1="397" x2="509.1" y2="397" class="primary"/><circle cx="501.2" cy="397" r="6" class="primary-dot"/><line x1="242.6" y1="417" x2="248.0" y2="417" class="shuffle"/><circle cx="245.5" cy="417" r="5" class="shuffle-dot"/><text x="517.1" y="401" class="value">0.209</text>
  <text x="205" y="500" class="legend">Predeclared pass rule: every language's upper 97.5% bound must remain below atomic EVA.</text>
</svg>
