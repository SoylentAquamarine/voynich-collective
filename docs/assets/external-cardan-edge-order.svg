<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="520" viewBox="0 0 1040 520" role="img" aria-labelledby="title desc">
  <title id="title">No Cardan-grille configuration reaches the required edge-prediction threshold</title>
  <desc id="desc">Mean held-out last-glyph to next-first-glyph predictive gain across replicates for four primary G_seq English configurations and three controls, against the required 0.15 bits/boundary threshold.</desc>
  <style>
    .title { font: 700 20px Georgia, serif; fill: #2d2922; }
    .subtitle, .tick { font: 11px Arial, sans-serif; fill: #665f53; }
  </style>
  <rect width="100%" height="100%" fill="#f6f0e3"/>
  <text x="90" y="28" class="title">Cardan-grille edge prediction falls far short of the required threshold</text>
  <text x="90" y="48" class="subtitle">Mean held-out edge gain (bits/boundary) per configuration; dashed line = required minimum</text>
  <line x1="90" y1="382.3" x2="995" y2="382.3" stroke="#6e675c" stroke-width="1"/>
  <line x1="90" y1="176.2" x2="995" y2="176.2" stroke="#a33" stroke-dasharray="5 4" stroke-width="1.5"/>
  <text x="991" y="170.2" text-anchor="end" class="tick" fill="#a33">required: 0.15</text>
  <rect x="62.0" y="362.9" width="56" height="19.4" fill="#496a63"/><text x="90.0" y="452" text-anchor="middle" class="tick" transform="rotate(20 90.0 452)">G_seq English p=0.00</text><text x="90.0" y="354.9" text-anchor="middle" class="tick">+0.014</text><rect x="212.8" y="370.3" width="56" height="12.0" fill="#496a63"/><text x="240.8" y="452" text-anchor="middle" class="tick" transform="rotate(20 240.8 452)">G_seq English p=0.05</text><text x="240.8" y="362.3" text-anchor="middle" class="tick">+0.009</text><rect x="363.7" y="373.5" width="56" height="8.8" fill="#496a63"/><text x="391.7" y="452" text-anchor="middle" class="tick" transform="rotate(20 391.7 452)">G_seq English p=0.10</text><text x="391.7" y="365.5" text-anchor="middle" class="tick">+0.006</text><rect x="514.5" y="382.3" width="56" height="2.4" fill="#496a63"/><text x="542.5" y="452" text-anchor="middle" class="tick" transform="rotate(20 542.5 452)">G_seq English p=0.30</text><text x="542.5" y="400.7" text-anchor="middle" class="tick">-0.002</text><rect x="665.3" y="382.3" width="56" height="12.4" fill="#9b5948"/><text x="693.3" y="452" text-anchor="middle" class="tick" transform="rotate(20 693.3 452)">G_seq Random p=0.00</text><text x="693.3" y="410.7" text-anchor="middle" class="tick">-0.009</text><rect x="816.2" y="382.3" width="56" height="12.7" fill="#9b5948"/><text x="844.2" y="452" text-anchor="middle" class="tick" transform="rotate(20 844.2 452)">G_seq Random p=1.00</text><text x="844.2" y="411.0" text-anchor="middle" class="tick">-0.009</text><rect x="967.0" y="382.3" width="56" height="20.2" fill="#9b5948"/><text x="995.0" y="452" text-anchor="middle" class="tick" transform="rotate(20 995.0 452)">G8 LEARNED-ENGLISH+RANDOM</text><text x="995.0" y="418.5" text-anchor="middle" class="tick">-0.015</text>
</svg>
