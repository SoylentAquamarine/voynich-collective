<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" role="img" aria-labelledby="title desc">
  <title id="title">Frequency-weighted novelty cuts the H2 damage roughly in half but does not close it</title>
  <desc id="desc">Mean H2 bigram entropy comparing uniform-substitution novelty (prior design) against frequency-weighted novelty (this design), with and without boundary coupling.</desc>
  <style>
    .title { font: 700 19px Georgia, serif; fill: #2d2922; }
    .subtitle, .tick { font: 11px Arial, sans-serif; fill: #665f53; }
  </style>
  <rect width="100%" height="100%" fill="#f6f0e3"/>
  <text x="90" y="26" class="title">Frequency-weighting halves the H2 damage, doesn't close it</text>
  <text x="90" y="46" class="subtitle">Mean H2 (bits) by novelty mechanism; shaded band is the required 2.540-2.840 range</text>
  <rect x="90" y="277.1" width="905" height="98.6" fill="#496a63" opacity="0.15"/>
  <line x1="90" y1="277.1" x2="995" y2="277.1" stroke="#496a63" stroke-dasharray="2 3" stroke-width="1.5"/>
  <line x1="90" y1="375.8" x2="995" y2="375.8" stroke="#496a63" stroke-dasharray="2 3" stroke-width="1.5"/>
  <text x="991" y="271.1" text-anchor="end" class="tick" fill="#496a63">required band</text>
  <line x1="90" y1="421.7" x2="995" y2="421.7" stroke="#6e675c" stroke-width="1"/>
  <rect x="124.2" y="319.5" width="140" height="102.2" fill="#496a63"/><text x="194.2" y="311.5" text-anchor="middle" class="tick">2.711</text><text x="194.2" y="441.7" text-anchor="middle" class="tick">baseline
[no novelty]</text><rect x="298.3" y="110.0" width="140" height="311.7" fill="#9b5948"/><text x="368.3" y="102.0" text-anchor="middle" class="tick">3.348</text><text x="368.3" y="441.7" text-anchor="middle" class="tick">uniform novelty
[old novelty_only]</text><rect x="472.5" y="242.6" width="140" height="179.1" fill="#496a63"/><text x="542.5" y="234.6" text-anchor="middle" class="tick">2.945</text><text x="542.5" y="441.7" text-anchor="middle" class="tick">frequency novelty
[new, nu=0.2]</text><rect x="646.7" y="108.0" width="140" height="313.7" fill="#9b5948"/><text x="716.7" y="100.0" text-anchor="middle" class="tick">3.354</text><text x="716.7" y="441.7" text-anchor="middle" class="tick">uniform novelty
+coupling [old primary]</text><rect x="820.8" y="242.2" width="140" height="179.5" fill="#496a63"/><text x="890.8" y="234.2" text-anchor="middle" class="tick">2.946</text><text x="890.8" y="441.7" text-anchor="middle" class="tick">frequency novelty
+coupling [new primary]</text>
</svg>
