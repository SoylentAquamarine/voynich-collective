<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Within-word character constraint by corpus</title>
  <desc id="desc">Voynich has 45.4 percent constraint, Medieval Latin 21.6 percent, and Italian 23.1 percent. Their within-word shuffled controls have 8.0, 2.6, and 2.9 percent respectively.</desc>
  <rect width="900" height="420" rx="10" fill="#f8f4ea"/>
  <text x="24" y="34" fill="#201d17" font-family="system-ui, sans-serif" font-size="17" font-weight="700">Fraction of character uncertainty removed by the previous character</text>
  <text x="24" y="57" fill="#6b6252" font-family="system-ui, sans-serif" font-size="12">Original corpus (red) compared with within-word shuffle (green)</text>
  <g stroke="#d9cfbc" stroke-width="1">
    <line x1="270" y1="74" x2="270" y2="365"/>
    <line x1="370" y1="74" x2="370" y2="365"/>
    <line x1="470" y1="74" x2="470" y2="365"/>
    <line x1="570" y1="74" x2="570" y2="365"/>
    <line x1="670" y1="74" x2="670" y2="365"/>
    <line x1="770" y1="74" x2="770" y2="365"/>
  </g>
  <g fill="#756b5c" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">
    <text x="270" y="385">0%</text><text x="370" y="385">10%</text><text x="470" y="385">20%</text><text x="570" y="385">30%</text><text x="670" y="385">40%</text><text x="770" y="385">50%</text>
  </g>
  <g fill="#201d17" font-family="Georgia, serif" font-size="17">
    <text x="24" y="121">Voynich</text><text x="24" y="218">Medieval Latin</text><text x="24" y="315">Italian</text>
  </g>
  <g fill="#8a3026">
    <rect x="270" y="90" width="454" height="26" rx="3"/>
    <rect x="270" y="187" width="216" height="26" rx="3"/>
    <rect x="270" y="284" width="231" height="26" rx="3"/>
  </g>
  <g fill="#4f5b43">
    <rect x="270" y="123" width="80" height="15" rx="2"/>
    <rect x="270" y="220" width="26" height="15" rx="2"/>
    <rect x="270" y="317" width="29" height="15" rx="2"/>
  </g>
  <g fill="#201d17" font-family="system-ui, sans-serif" font-size="13" font-weight="700">
    <text x="733" y="108">45.4%</text><text x="495" y="205">21.6%</text><text x="510" y="302">23.1%</text>
  </g>
  <g fill="#5f6c51" font-family="system-ui, sans-serif" font-size="11">
    <text x="358" y="135">shuffle 8.0%</text><text x="304" y="232">2.6%</text><text x="307" y="329">2.9%</text>
  </g>
  <text x="24" y="400" fill="#756b5c" font-family="system-ui, sans-serif" font-size="10">Source: Voynich Collective language-baselines-report.md · 39,020 tokens per original corpus</text>
</svg>
