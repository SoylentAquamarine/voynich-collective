<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
  <title id="title">Currier language by illustration type and Davis scribal hand</title>
  <desc id="desc">Stacked page counts show that Herbal pages contain both Currier A and B, while Davis hand one is almost entirely A and hands two, three, and five are predominantly B. Gray indicates pages without a Currier language label.</desc>
  <style>
    .title { font: 700 22px Georgia, serif; fill: #2d2922; }
    .subtitle, .legend, .count { font: 13px Arial, sans-serif; fill: #665f53; }
    .panel-title { font: 700 17px Georgia, serif; fill: #2d2922; }
    .label { font: 13px Arial, sans-serif; fill: #2d2922; }
  </style>
  <rect width="100%" height="100%" fill="#f6f0e3"/>
  <text x="180" y="30" class="title">Currier A/B is more tightly aligned with hand than illustration type</text>
  <text x="180" y="52" class="subtitle">Page metadata from ZL3b IVTFF headers; descriptive association, not causal identification</text>
  <g transform="translate(0,0)">
    <rect x="180" y="66" width="14" height="14" fill="#496a63"/><text x="200" y="78" class="legend">Currier A</text>
    <rect x="290" y="66" width="14" height="14" fill="#9b5948"/><text x="310" y="78" class="legend">Currier B</text>
    <rect x="400" y="66" width="14" height="14" fill="#c9c0af"/><text x="420" y="78" class="legend">Unlabeled</text>
  </g>
  <text x="180" y="112" class="panel-title">By illustration type</text><text x="168" y="154" text-anchor="end" class="label">Herbal</text><rect x="180.0" y="140" width="559.7" height="18" fill="#496a63"><title>Herbal: A = 95</title></rect><rect x="739.7" y="140" width="188.5" height="18" fill="#9b5948"><title>Herbal: B = 32</title></rect><rect x="928.2" y="140" width="11.8" height="18" fill="#c9c0af"><title>Herbal: unlabeled = 2</title></rect><text x="947.0" y="154" class="count">129</text><text x="168" y="181" text-anchor="end" class="label">Astronomical</text><rect x="180.0" y="167" width="47.1" height="18" fill="#c9c0af"><title>Astronomical: unlabeled = 8</title></rect><text x="234.1" y="181" class="count">8</text><text x="168" y="208" text-anchor="end" class="label">Zodiac</text><rect x="180.0" y="194" width="70.7" height="18" fill="#c9c0af"><title>Zodiac: unlabeled = 12</title></rect><text x="257.7" y="208" class="count">12</text><text x="168" y="235" text-anchor="end" class="label">Biological</text><rect x="180.0" y="221" width="111.9" height="18" fill="#9b5948"><title>Biological: B = 19</title></rect><text x="298.9" y="235" class="count">19</text><text x="168" y="262" text-anchor="end" class="label">Cosmological</text><rect x="180.0" y="248" width="23.6" height="18" fill="#9b5948"><title>Cosmological: B = 4</title></rect><rect x="203.6" y="248" width="41.2" height="18" fill="#c9c0af"><title>Cosmological: unlabeled = 7</title></rect><text x="251.8" y="262" class="count">11</text><text x="168" y="289" text-anchor="end" class="label">Pharmaceutical</text><rect x="180.0" y="275" width="94.3" height="18" fill="#496a63"><title>Pharmaceutical: A = 16</title></rect><text x="281.3" y="289" class="count">16</text><text x="168" y="316" text-anchor="end" class="label">Marginal stars</text><rect x="180.0" y="302" width="11.8" height="18" fill="#496a63"><title>Marginal stars: A = 2</title></rect><rect x="191.8" y="302" width="135.5" height="18" fill="#9b5948"><title>Marginal stars: B = 23</title></rect><text x="334.3" y="316" class="count">25</text><text x="168" y="343" text-anchor="end" class="label">Text-only</text><rect x="180.0" y="329" width="5.9" height="18" fill="#496a63"><title>Text-only: A = 1</title></rect><rect x="185.9" y="329" width="29.5" height="18" fill="#9b5948"><title>Text-only: B = 5</title></rect><rect x="215.3" y="329" width="5.9" height="18" fill="#c9c0af"><title>Text-only: unlabeled = 1</title></rect><text x="228.2" y="343" class="count">7</text>
  <text x="180" y="388" class="panel-title">By Davis hand</text><text x="168" y="430" text-anchor="end" class="label">Hand 1</text><rect x="180.0" y="416" width="753.3" height="18" fill="#496a63"><title>Hand 1: A = 112</title></rect><rect x="933.3" y="416" width="6.7" height="18" fill="#c9c0af"><title>Hand 1: unlabeled = 1</title></rect><text x="947.0" y="430" class="count">113</text><text x="168" y="457" text-anchor="end" class="label">Hand 2</text><rect x="180.0" y="443" width="309.4" height="18" fill="#9b5948"><title>Hand 2: B = 46</title></rect><text x="496.4" y="457" class="count">46</text><text x="168" y="484" text-anchor="end" class="label">Hand 3</text><rect x="180.0" y="470" width="13.5" height="18" fill="#496a63"><title>Hand 3: A = 2</title></rect><rect x="193.5" y="470" width="188.3" height="18" fill="#9b5948"><title>Hand 3: B = 28</title></rect><rect x="381.8" y="470" width="20.2" height="18" fill="#c9c0af"><title>Hand 3: unlabeled = 3</title></rect><text x="408.9" y="484" class="count">33</text><text x="168" y="511" text-anchor="end" class="label">Hand 4</text><rect x="180.0" y="497" width="6.7" height="18" fill="#9b5948"><title>Hand 4: B = 1</title></rect><rect x="186.7" y="497" width="174.9" height="18" fill="#c9c0af"><title>Hand 4: unlabeled = 26</title></rect><text x="368.6" y="511" class="count">27</text><text x="168" y="538" text-anchor="end" class="label">Hand 5</text><rect x="180.0" y="524" width="47.1" height="18" fill="#9b5948"><title>Hand 5: B = 7</title></rect><text x="234.1" y="538" class="count">7</text><text x="168" y="565" text-anchor="end" class="label">Hand @</text><rect x="180.0" y="551" width="6.7" height="18" fill="#9b5948"><title>Hand @: B = 1</title></rect><text x="193.7" y="565" class="count">1</text>
</svg>
