<svg xmlns="http://www.w3.org/2000/svg" width="940" height="520" viewBox="0 0 940 520" role="img" aria-labelledby="title desc">
  <title id="title">The Cardan projection attenuates English edge order</title>
  <desc id="desc">Raw sequential English EWT gains 0.038 bits per held-out word boundary. Four-hole projected streams range from about 0.013 bits at zero random jumps to below zero with frequent jumps, far below the frozen Voynich threshold of 0.15.</desc>
  <style>.title{font:700 22px system-ui,sans-serif;fill:#272621}.subtitle{font:14px system-ui,sans-serif;fill:#5f5a52}.label,.tick{font:13px system-ui,sans-serif;fill:#4e4942}.value{font:600 12px system-ui,sans-serif;fill:#38342f}.grid{stroke:#ddd7cc;stroke-width:1}</style>
  <rect width="100%" height="100%" fill="#fbf9f4" rx="12"/>
  <text x="92" y="34" class="title">The grille loses most cross-word edge order</text>
  <text x="92" y="58" class="subtitle">Held-out edge gain; bars are 20-seed means, whiskers show min–max (raw EWT is deterministic)</text>
  <line x1="92" y1="428.5" x2="912" y2="428.5" class="grid"/><text x="80" y="432.5" text-anchor="end" class="tick">-0.02</text><line x1="92" y1="390.4" x2="912" y2="390.4" class="grid"/><text x="80" y="394.4" text-anchor="end" class="tick">0.00</text><line x1="92" y1="295.3" x2="912" y2="295.3" class="grid"/><text x="80" y="299.3" text-anchor="end" class="tick">0.05</text><line x1="92" y1="200.2" x2="912" y2="200.2" class="grid"/><text x="80" y="204.2" text-anchor="end" class="tick">0.10</text><line x1="92" y1="105.0" x2="912" y2="105.0" class="grid"/><text x="80" y="109.0" text-anchor="end" class="tick">0.15</text>
  <line x1="92" y1="105.0" x2="912" y2="105.0" stroke="#3d586e" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="912" y="97.0" text-anchor="end" class="value">Frozen Voynich threshold 0.15</text>
  <rect x="129.3" y="319.0" width="62" height="71.4" rx="3" fill="#496a63"/><line x1="160.3" y1="319.0" x2="160.3" y2="319.0" stroke="#423f3a" stroke-width="1.5"/><text x="160.3" y="475" text-anchor="middle" class="label">Raw EWT</text><text x="160.3" y="311.0" text-anchor="middle" class="value">+0.038</text><rect x="266.0" y="363.6" width="62" height="26.9" rx="3" fill="#9b5948"/><line x1="297.0" y1="368.3" x2="297.0" y2="360.0" stroke="#423f3a" stroke-width="1.5"/><text x="297.0" y="475" text-anchor="middle" class="label">p=0</text><text x="297.0" y="355.6" text-anchor="middle" class="value">+0.014</text><rect x="402.7" y="374.0" width="62" height="16.4" rx="3" fill="#9b5948"/><line x1="433.7" y1="382.7" x2="433.7" y2="368.3" stroke="#423f3a" stroke-width="1.5"/><text x="433.7" y="475" text-anchor="middle" class="label">p=.05</text><text x="433.7" y="366.0" text-anchor="middle" class="value">+0.009</text><rect x="539.3" y="378.7" width="62" height="11.8" rx="3" fill="#9b5948"/><line x1="570.3" y1="384.9" x2="570.3" y2="372.2" stroke="#423f3a" stroke-width="1.5"/><text x="570.3" y="475" text-anchor="middle" class="label">p=.10</text><text x="570.3" y="370.7" text-anchor="middle" class="value">+0.006</text><rect x="676.0" y="390.4" width="62" height="3.1" rx="3" fill="#9b5948"/><line x1="707.0" y1="401.7" x2="707.0" y2="388.1" stroke="#423f3a" stroke-width="1.5"/><text x="707.0" y="475" text-anchor="middle" class="label">p=.30</text><text x="707.0" y="385.5" text-anchor="middle" class="value">-0.002</text><rect x="812.7" y="390.4" width="62" height="29.0" rx="3" fill="#9b5948"/><line x1="843.7" y1="422.2" x2="843.7" y2="417.3" stroke="#423f3a" stroke-width="1.5"/><text x="843.7" y="475" text-anchor="middle" class="label">p=1</text><text x="843.7" y="411.4" text-anchor="middle" class="value">-0.015</text>
  <text x="20" y="262.0" transform="rotate(-90 20 262.0)" text-anchor="middle" class="label">Gain (bits per boundary)</text>
</svg>