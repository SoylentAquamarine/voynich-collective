<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" role="img" aria-labelledby="title desc">
  <title id="title">The boundary-coupling rule easily exceeds the required edge-prediction threshold</title>
  <desc id="desc">Mean held-out edge-prediction gain per configuration for the boundary-coupled constructive null, compared to the required 0.15 bits/boundary threshold and Voynich's own point estimate.</desc>
  <style>
    .title { font: 700 20px Georgia, serif; fill: #2d2922; }
    .subtitle, .tick { font: 11px Arial, sans-serif; fill: #665f53; }
  </style>
  <rect width="100%" height="100%" fill="#f6f0e3"/>
  <text x="90" y="28" class="title">Coupling-by-construction over-satisfies the edge criterion</text>
  <text x="90" y="48" class="subtitle">Mean held-out edge gain (bits/boundary); dashed lines mark the required threshold and Voynich's own value</text>
  <line x1="90" y1="421.7" x2="995" y2="421.7" stroke="#6e675c" stroke-width="1"/>
  <line x1="90" y1="402.0" x2="995" y2="402.0" stroke="#a33" stroke-dasharray="5 4" stroke-width="1.5"/>
  <text x="991" y="396.0" text-anchor="end" class="tick" fill="#a33">required: 0.15</text>
  <line x1="90" y1="397.1" x2="995" y2="397.1" stroke="#496a63" stroke-dasharray="2 3" stroke-width="1.5"/>
  <text x="991" y="391.1" text-anchor="end" class="tick" fill="#496a63">Voynich: 0.187</text>
  <rect x="60.0" y="392.1" width="60" height="29.6" fill="#496a63"/><text x="90.0" y="452" text-anchor="middle" class="tick" transform="rotate(25 90.0 452)">p_couple=0.30</text><text x="90.0" y="384.1" text-anchor="middle" class="tick">+0.225</text><rect x="210.8" y="344.2" width="60" height="77.5" fill="#496a63"/><text x="240.8" y="452" text-anchor="middle" class="tick" transform="rotate(25 240.8 452)">p_couple=0.50</text><text x="240.8" y="336.2" text-anchor="middle" class="tick">+0.589</text><rect x="361.7" y="275.1" width="60" height="146.6" fill="#496a63"/><text x="391.7" y="452" text-anchor="middle" class="tick" transform="rotate(25 391.7 452)">p_couple=0.70</text><text x="391.7" y="267.1" text-anchor="middle" class="tick">+1.114</text><rect x="512.5" y="178.8" width="60" height="242.8" fill="#496a63"/><text x="542.5" y="452" text-anchor="middle" class="tick" transform="rotate(25 542.5 452)">p_couple=0.90</text><text x="542.5" y="170.8" text-anchor="middle" class="tick">+1.846</text><rect x="663.3" y="104.8" width="60" height="316.9" fill="#496a63"/><text x="693.3" y="452" text-anchor="middle" class="tick" transform="rotate(25 693.3 452)">p_couple=1.00</text><text x="693.3" y="96.8" text-anchor="middle" class="tick">+2.409</text><rect x="814.2" y="421.7" width="60" height="1.7" fill="#9b5948"/><text x="844.2" y="452" text-anchor="middle" class="tick" transform="rotate(25 844.2 452)">p_couple=0.00 [negative control]</text><text x="844.2" y="439.4" text-anchor="middle" class="tick">-0.013</text><rect x="965.0" y="86.6" width="60" height="335.1" fill="#9b5948"/><text x="995.0" y="452" text-anchor="middle" class="tick" transform="rotate(25 995.0 452)">p_couple=1.00 [ablation: uniform internal]</text><text x="995.0" y="78.6" text-anchor="middle" class="tick">+2.548</text>
</svg>
